# VPS do Banho e Tosa: conexão com o WhatsApp (Evolution API) + worker de envio e lembretes.
# Uso: cp deploy/.env.vps.example deploy/.env.vps, preencha, e rode:
#   docker compose -f deploy/docker-compose.vps.yml --env-file deploy/.env.vps up -d --build
name: banho-e-tosa

services:
  evolution:
    # Confira a versão estável mais recente em https://doc.evolution-api.com antes de atualizar.
    image: atendai/evolution-api:v2.2.3
    restart: unless-stopped
    depends_on: [evolution-db]
    ports:
      - "127.0.0.1:8080:8080"   # exponha para a internet só por trás de um proxy com HTTPS (ver README)
    environment:
      SERVER_URL: ${EVOLUTION_PUBLIC_URL}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-db:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: banho_e_tosa
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: ${APP_URL}/api/whatsapp/webhook?secret=${WEBHOOK_SECRET}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      LOG_LEVEL: ERROR,WARN
    volumes:
      - evolution_instances:/evolution/instances

  evolution-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: ${EVOLUTION_DB_PASSWORD}
      POSTGRES_DB: evolution
    volumes:
      - evolution_db:/var/lib/postgresql/data

  worker:
    build:
      context: ..
      dockerfile: deploy/worker.Dockerfile
    restart: unless-stopped
    depends_on: [evolution]
    environment:
      SUPABASE_SERVICE_DATABASE_URL: ${SUPABASE_SERVICE_DATABASE_URL}
      WHATSAPP_PROVIDER: evolution
      EVOLUTION_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE: ${EVOLUTION_INSTANCE}
      TZ: America/Sao_Paulo

volumes:
  evolution_instances:
  evolution_db:
