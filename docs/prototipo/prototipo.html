<title>Banho e Tosa Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap">
<style>
/* Layout: app de Mac. Barra lateral translúcida (lista de fontes com ícones em quadradinhos coloridos), barra de ferramentas de vidro fixa, conteúdo em listas agrupadas e cartões com cantos contínuos. Uma cor de destaque (menta) + cores de sistema só para estado. */
:root{
  --bg:#F5F5F7; --surface:#FFFFFF; --fill:rgba(118,118,128,.12); --fill2:rgba(118,118,128,.08);
  --sep:rgba(60,60,67,.14); --ink:#1D1D1F; --ink2:#6E6E73; --ink3:#86868B;
  --tint:#00877C; --tint-hover:#006F66; --on-tint:#FFFFFF; --tint-soft:rgba(0,135,124,.10);
  --orange:#C25E00; --orange-fill:#FF9500; --orange-soft:rgba(255,149,0,.14);
  --green:#1E7B34; --green-fill:#34C759; --green-soft:rgba(52,199,89,.14);
  --red:#C9241B; --red-soft:rgba(255,59,48,.12);
  --glass:rgba(250,250,252,.72); --glass-side:rgba(236,236,240,.78); --glass-line:rgba(0,0,0,.08);
  --shadow:0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
  --shadow-hi:0 2px 4px rgba(0,0,0,.05), 0 12px 32px rgba(0,0,0,.09);
  --sheet:0 24px 80px rgba(0,0,0,.22), 0 0 0 .5px rgba(0,0,0,.1);
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
  --font-d:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", system-ui, sans-serif;
  --r-xl:22px; --r-lg:16px; --r-md:12px; --r-sm:10px;
  --spring:cubic-bezier(.32,.72,0,1);
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;letter-spacing:-.011em}
*{box-sizing:border-box}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance}
button,input,select{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.45}
:focus-visible{outline:3px solid color-mix(in srgb,var(--tint) 55%,transparent);outline-offset:2px;border-radius:10px}
.num{font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:15px;height:15px}
.ic.lg{width:22px;height:22px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--ink2)}
.cap{font-size:13px;color:var(--ink2)}

/* Janela */
.app{display:flex;min-height:100%;background:radial-gradient(1200px 600px at 100% -10%,color-mix(in srgb,var(--tint) 7%,transparent),transparent 60%),var(--bg)}
.side{flex:0 0 248px;position:sticky;top:0;height:100vh;padding:20px 12px;display:flex;flex-direction:column;gap:2px;background:var(--glass-side);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-right:.5px solid var(--glass-line)}
.app-id{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.app-icon{width:34px;height:34px;border-radius:9px;background:linear-gradient(160deg,#5FE3C9,#00877C);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:inset 0 .5px 0 rgba(255,255,255,.5),0 2px 6px rgba(0,135,124,.35)}
.app-id b{font-size:16px;font-weight:700;display:block;line-height:1.1}
.app-id span{font-size:12px;color:var(--ink2)}
.side .group{font-size:12px;font-weight:600;color:var(--ink3);padding:14px 10px 6px}
.side a{display:flex;align-items:center;gap:10px;min-height:38px;padding:0 10px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:15px;font-weight:500;transition:background .15s}
.side a:hover{background:var(--fill2)}
.side a[aria-current="page"]{background:var(--fill)}
.tile{width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:inset 0 .5px 0 rgba(255,255,255,.35)}
.tile .ic{width:15px;height:15px;stroke-width:2.2}
.t-orange{background:linear-gradient(180deg,#FFAC33,#FF9500)} .t-red{background:linear-gradient(180deg,#FF6259,#FF3B30)}
.t-blue{background:linear-gradient(180deg,#3B96FF,#007AFF)} .t-green{background:linear-gradient(180deg,#4CD964,#28B348)}
.t-pink{background:linear-gradient(180deg,#FF5A7A,#FF2D55)} .t-teal{background:linear-gradient(180deg,#4FC3DB,#30A6C7)}
.side .count{margin-left:auto;font-size:13px;font-weight:600;color:var(--ink2)}
.side .count.hot{background:var(--orange-fill);color:#fff;border-radius:10px;padding:0 7px;min-width:20px;text-align:center}
.side .foot{margin-top:auto;padding:12px 10px 0;font-size:12px;color:var(--ink3)}

.work{flex:1;min-width:0;display:flex;flex-direction:column}
.toolbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;align-items:center;gap:12px;min-height:56px;padding-block:10px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));background:var(--glass);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);border-bottom:.5px solid var(--glass-line)}
.toolbar .crumb{font-weight:600;font-size:15px}
.search{position:relative;flex:0 1 300px;margin-left:auto}
.search .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink3)}
.search input{width:100%;min-height:36px;border-radius:10px;border:0;background:var(--fill);padding:0 12px 0 34px;font-size:15px}
.search input::placeholder{color:var(--ink3)}
.search input:focus{outline:none;box-shadow:0 0 0 3.5px color-mix(in srgb,var(--tint) 40%,transparent)}
.wa{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.wa i{width:8px;height:8px;border-radius:50%;background:var(--green-fill);box-shadow:0 0 0 3px var(--green-soft);display:block}
.ibtn{width:36px;height:36px;border-radius:10px;border:0;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--ink2);transition:background .15s}
.ibtn:hover{background:var(--fill2);color:var(--ink)}

main{flex:1;padding-block:28px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:24px;max-width:1240px;margin:0 auto;animation:in .45s var(--spring)}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.eyebrow{font-size:15px;font-weight:600;color:var(--tint);margin:0 0 2px}
.large{font-size:40px;font-weight:700;letter-spacing:-.028em;line-height:1.08}
.title2{font-size:22px;font-weight:700;letter-spacing:-.02em}
.title3{font-size:17px;font-weight:600;letter-spacing:-.015em}
.actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:40px;padding:0 18px;border-radius:999px;border:0;background:var(--tint);color:var(--on-tint);font-weight:600;font-size:15px;text-decoration:none;transition:background .2s,transform .25s var(--spring),opacity .2s}
.btn:hover{background:var(--tint-hover)}
.btn:active{transform:scale(.97)}
.btn.gray{background:var(--fill);color:var(--ink)}
.btn.gray:hover{background:color-mix(in srgb,var(--fill) 100%,var(--fill2))}
.btn.tinted{background:var(--tint-soft);color:var(--tint)}
.btn.tinted:hover{background:color-mix(in srgb,var(--tint-soft) 100%,var(--tint-soft))}
.btn.orange{background:var(--orange-fill);color:#1D1300}
.btn.orange:hover{filter:brightness(1.05)}
.btn.sm{min-height:34px;padding:0 14px;font-size:14px}
.btn.lg{min-height:50px;font-size:17px;border-radius:14px}
.btn[aria-busy="true"]{pointer-events:none;opacity:.8}
.spin{width:15px;height:15px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.seg{display:inline-flex;background:var(--fill);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:transparent;min-height:32px;padding:0 14px;border-radius:8px;font-size:14px;font-weight:500;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}

.card{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow)}
.pad{padding:20px 22px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;background:var(--fill2);color:var(--ink2);white-space:nowrap}
.chip.tint{background:var(--tint-soft);color:var(--tint)}
.chip.orange{background:var(--orange-soft);color:var(--orange)}
.chip.green{background:var(--green-soft);color:var(--green)}
.chip.red{background:var(--red-soft);color:var(--red)}

/* Monogramas estilo Contatos */
.mono{flex:0 0 auto;width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:16px;color:#fff;letter-spacing:0;background:linear-gradient(180deg,var(--a),var(--b));box-shadow:inset 0 .5px 0 rgba(255,255,255,.35)}
.mono.sm{width:32px;height:32px;font-size:13px}
.mono.xl{width:96px;height:96px;font-size:38px}
.g1{--a:#A8B0BD;--b:#858D9A} .g2{--a:#5FD2C1;--b:#14A08F} .g3{--a:#FFB15E;--b:#F2862E} .g4{--a:#FF8FA3;--b:#F0607D} .g5{--a:#6FB8FF;--b:#3A8EE6} .g6{--a:#E2C26A;--b:#C29C34}

/* Widgets do Hoje */
.widgets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.widget{background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;transition:transform .3s var(--spring),box-shadow .3s}
a.widget:hover{transform:translateY(-2px);box-shadow:var(--shadow-hi)}
.widget .w-top{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink2)}
.widget .w-num{font-family:var(--font-d);font-size:34px;font-weight:700;letter-spacing:-.03em;line-height:1}
.widget .w-sub{font-size:13px;color:var(--ink2)}

/* Quadro */
.board{display:grid;grid-template-columns:repeat(4,minmax(232px,1fr));gap:14px;overflow-x:auto;padding:2px 2px 8px}
.col{border-radius:var(--r-xl);padding:10px;display:flex;flex-direction:column;gap:10px;min-height:380px;background:var(--fill2);transition:background .2s,box-shadow .2s}
.col.over{background:var(--tint-soft);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--tint) 45%,transparent)}
.col-h{display:flex;align-items:center;gap:8px;padding:6px 8px 2px;font-size:14px;font-weight:600}
.col-h .dotc{width:8px;height:8px;border-radius:50%}
.col-h .n{margin-left:auto;color:var(--ink3);font-weight:600}
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:24px 16px;color:var(--ink3);font-size:14px;border-radius:var(--r-lg);border:1.5px dashed var(--sep)}
.pet{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:14px;display:flex;flex-direction:column;gap:10px;cursor:grab;transition:transform .35s var(--spring),box-shadow .3s}
.pet:hover{transform:translateY(-2px);box-shadow:var(--shadow-hi)}
.pet.dragging{opacity:.4;transform:scale(.98)}
.pet .top{display:flex;align-items:center;gap:10px}
.pet .nm{font-weight:600;font-size:16px;line-height:1.2}
.pet .br{font-size:13px;color:var(--ink2)}
.pet .tm{margin-left:auto;align-self:flex-start;font-size:13px;font-weight:600;color:var(--ink2)}
.pet .svc{font-size:14px}
.pet .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.pet .note{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:5px}
.notice{border-radius:var(--r-md);background:var(--orange-soft);padding:12px;display:flex;flex-direction:column;gap:10px}
.notice p{margin:0;font-size:14px;font-weight:500}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:44px}
.switch{position:relative;width:51px;height:31px;flex:0 0 auto}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--fill);transition:background .25s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.16);transition:transform .3s var(--spring)}
.switch input:checked + span{background:var(--green-fill)}
.switch input:checked + span::after{transform:translateX(20px)}
.switch input:focus-visible + span{outline:3px solid color-mix(in srgb,var(--tint) 55%,transparent);outline-offset:2px}

/* Lista agrupada (estilo Ajustes) */
.glist{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);overflow:hidden}
.glist > .row{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 16px;position:relative}
.glist > .row + .row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
.glist > .row.ind + .row::before,.glist > .row + .row.ind::before{left:60px}
.glist .grow{flex:1;min-width:0}
.glist .val{color:var(--ink2);font-variant-numeric:tabular-nums}
button.row{width:100%;border:0;background:transparent;text-align:left;transition:background .15s}
button.row:hover{background:var(--fill2)}
button.row[aria-current="true"]{background:var(--tint-soft)}
.glabel{font-size:13px;font-weight:600;color:var(--ink2);margin:0 0 8px 16px}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .25s ease}
.sheet{width:min(480px,100%);max-height:100%;overflow:auto;background:var(--bg);border-radius:26px;box-shadow:var(--sheet);padding:22px;display:flex;flex-direction:column;gap:18px;animation:pop .45s var(--spring)}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(12px)}}
.sh-head{display:flex;align-items:center;gap:12px}
.close{margin-left:auto;width:30px;height:30px;border-radius:50%;border:0;background:var(--fill);color:var(--ink2);display:flex;align-items:center;justify-content:center}
.close .ic{width:14px;height:14px;stroke-width:2.6}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink2);margin-left:4px}
.input{min-height:46px;border:0;background:var(--surface);border-radius:var(--r-md);padding:0 14px;box-shadow:var(--shadow);font-size:16px}
.input:focus{outline:none;box-shadow:0 0 0 3.5px color-mix(in srgb,var(--tint) 40%,transparent)}
.input[aria-invalid="true"]{box-shadow:0 0 0 2px var(--red)}
.err{font-size:13px;color:var(--red);font-weight:600;margin-left:4px}
.help{font-size:13px;color:var(--ink2);margin-left:4px}
.paygrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pay{min-height:72px;border-radius:var(--r-md);border:0;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:600;transition:box-shadow .2s,transform .25s var(--spring)}
.pay:active{transform:scale(.97)}
.pay[aria-pressed="true"]{box-shadow:0 0 0 2px var(--tint);color:var(--tint)}
.total{font-family:var(--font-d);font-size:34px;font-weight:700;letter-spacing:-.03em}

.toast{position:fixed;left:50%;top:max(16px,env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:12px;padding:8px 8px 8px 16px;border-radius:999px;background:var(--glass);backdrop-filter:saturate(180%) blur(24px);-webkit-backdrop-filter:saturate(180%) blur(24px);box-shadow:var(--shadow-hi),0 0 0 .5px var(--glass-line);font-size:14px;font-weight:600;animation:drop .5s var(--spring)}
.toast .ok{width:22px;height:22px;border-radius:50%;background:var(--green-fill);color:#fff;display:flex;align-items:center;justify-content:center}
.toast .ok .ic{width:13px;height:13px;stroke-width:3}
.toast button{border:0;background:var(--fill);border-radius:999px;min-height:30px;padding:0 12px;font-weight:600;font-size:13px;color:var(--tint)}
@keyframes drop{from{opacity:0;transform:translate(-50%,-14px) scale(.96)}}

/* Agenda */
.cal{display:grid;grid-template-columns:56px repeat(2,minmax(250px,1fr));gap:0 12px;overflow-x:auto}
.cal .hd{display:flex;align-items:center;gap:10px;padding:0 4px 12px}
.cal .hr{height:66px;font-size:12px;font-weight:600;color:var(--ink3);text-align:right;padding-right:8px;transform:translateY(-8px)}
.lane{position:relative;background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);background-image:linear-gradient(var(--sep) .5px,transparent .5px);background-size:100% 66px}
.ev{position:absolute;left:6px;right:6px;border-radius:10px;padding:7px 10px;font-size:13px;overflow:hidden;display:flex;flex-direction:column;border:0;text-align:left}
.ev b{font-size:14px;font-weight:600}
.ev.done{background:var(--fill2);color:var(--ink2)}
.ev.now{background:var(--tint);color:var(--on-tint);box-shadow:0 6px 16px -6px color-mix(in srgb,var(--tint) 60%,transparent)}
.ev.next{background:var(--tint-soft);color:var(--ink)}
.ev.free{background:transparent;border:1.5px dashed var(--sep);color:var(--ink3);flex-direction:row;align-items:center;justify-content:center;gap:6px;font-weight:600;transition:all .2s}
.ev.free:hover{border-color:var(--tint);color:var(--tint);background:var(--tint-soft)}
.now-line{position:absolute;left:-6px;right:0;height:1.5px;background:var(--red);z-index:2}
.now-line::before{content:"";position:absolute;left:0;top:-4px;width:9px;height:9px;border-radius:50%;background:var(--red)}

/* Pets */
.split{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.split > .left{flex:1 1 280px;max-width:330px;display:flex;flex-direction:column;gap:12px}
.split > .right{flex:999 1 520px;min-width:0;display:flex;flex-direction:column;gap:20px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:28px 22px 22px}
.hero h2{font-size:30px;font-weight:700;letter-spacing:-.025em}
.quick{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:6px}
.qbtn{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:84px;padding:10px 12px;border-radius:var(--r-md);border:0;background:var(--tint-soft);color:var(--tint);font-size:12px;font-weight:600;text-decoration:none;transition:transform .25s var(--spring)}
.qbtn:active{transform:scale(.96)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.ring{--p:0;width:64px;height:64px;border-radius:50%;background:conic-gradient(var(--c,var(--tint)) calc(var(--p)*1%),var(--fill) 0);display:flex;align-items:center;justify-content:center}
.ring::before{content:"";width:52px;height:52px;border-radius:50%;background:var(--surface);grid-area:1/1}
.ring{display:grid;place-items:center}
.ring span{grid-area:1/1;font-size:13px;font-weight:700}
.stat{display:flex;align-items:center;gap:14px;padding:16px 18px}
.stat .big{font-family:var(--font-d);font-size:19px;font-weight:700;letter-spacing:-.02em;line-height:1.1}

/* Mensagens */
.inbox{display:flex;flex-wrap:wrap;gap:20px;align-items:stretch}
.inbox .left{flex:1 1 280px;max-width:340px}
.thread{display:flex;flex-direction:column;flex:999 1 480px;min-width:0;background:var(--surface);border-radius:var(--r-xl);box-shadow:var(--shadow);overflow:hidden}
.th-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:.5px solid var(--sep)}
.th-body{display:flex;flex-direction:column;gap:6px;padding:20px 18px;flex:1}
.stamp{align-self:center;font-size:12px;font-weight:600;color:var(--ink3);margin:4px 0 8px}
.bub{max-width:min(420px,80%);padding:9px 14px;border-radius:20px;font-size:15px;line-height:1.35}
.bub.out{align-self:flex-end;background:var(--tint);color:var(--on-tint);border-bottom-right-radius:6px}
.bub.in{align-self:flex-start;background:var(--fill);border-bottom-left-radius:6px}
.meta-out{align-self:flex-end;font-size:11px;color:var(--ink3);margin:-2px 6px 6px}
.meta-in{align-self:flex-start;font-size:11px;color:var(--ink3);margin:-2px 6px 6px}
.offer{margin:0 18px;border-radius:var(--r-lg);background:var(--bg);padding:14px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}
.offer .od{width:46px;height:50px;border-radius:10px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto}
.offer .od small{display:block;width:100%;text-align:center;background:var(--red);color:#fff;font-size:10px;font-weight:700;padding:1px 0}
.offer .od b{font-size:20px;line-height:1.2}
.compose{display:flex;gap:8px;padding:12px 14px;border-top:.5px solid var(--sep)}
.compose input{flex:1;min-width:0;min-height:38px;border-radius:999px;border:.5px solid var(--sep);background:var(--bg);padding:0 16px;font-size:15px}
.compose input:focus{outline:none;box-shadow:0 0 0 3.5px color-mix(in srgb,var(--tint) 40%,transparent)}
.send{width:38px;height:38px;border-radius:50%;border:0;background:var(--tint);color:var(--on-tint);display:flex;align-items:center;justify-content:center}

/* Pacotes e caixa */
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.pkg{position:relative;overflow:hidden;border-radius:var(--r-xl);padding:20px;min-height:170px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;box-shadow:var(--shadow-hi)}
.pkg.p1{background:linear-gradient(140deg,#14A08F,#0B6F64)}
.pkg.p2{background:linear-gradient(140deg,#3A8EE6,#1F5FB0)}
.pkg.p3{background:linear-gradient(140deg,#3A3A3C,#1C1C1E)}
.pkg h3{font-size:17px;font-weight:600}
.pkg .pr{font-family:var(--font-d);font-size:34px;font-weight:700;letter-spacing:-.03em}
.pkg .ps{font-size:13px;opacity:.85}
.pkg::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.bigsum{font-family:var(--font-d);font-size:64px;font-weight:700;letter-spacing:-.04em;line-height:1}
.bars{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:var(--fill)}
.legend{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.legend div{display:flex;flex-direction:column;gap:2px}
.legend span{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink2);font-weight:500}
.legend i{width:8px;height:8px;border-radius:2px;display:block}
.legend b{font-size:17px;font-variant-numeric:tabular-nums}
.scroll{overflow-x:auto}

@media (max-width:1100px){ .widgets{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:900px){
  .app{flex-direction:column}
  .side{position:static;height:auto;flex:none;flex-direction:row;flex-wrap:wrap;gap:4px;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));border-right:0;border-bottom:.5px solid var(--glass-line)}
  .app-id{width:100%;padding:4px 4px 8px}
  .side .group,.side .foot{display:none}
  .toolbar,main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .large{font-size:32px}
  .trio,.legend{grid-template-columns:repeat(2,minmax(0,1fr))}
  .bigsum{font-size:46px}
  .paygrid{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){ .widgets,.trio{grid-template-columns:minmax(0,1fr)} .split > .left,.inbox .left{max-width:none} .wa{display:none} }
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@media (prefers-reduced-transparency:reduce){.side,.toolbar,.toast{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--surface)}}
</style>

}
function petCard(p, i) {
  const next = STAGES[i + 1];
  let foot = '';
  if (S.ask === p.id) {
    foot = `<div class="notice" role="group" aria-label="Avisar tutor"><p>${esc(p.name)} terminou. Avisar ${esc(first(p.tutor))}?</p>
      <div class="switchrow"><span style="font-size:14px">Mensagem no WhatsApp</span><label class="switch"><input type="checkbox" id="sw-${p.id}" ${S.notify ? 'checked' : ''} data-act="toggle" aria-label="Enviar mensagem no WhatsApp"><span></span></label></div>
      <button class="btn orange sm" data-act="notify" data-id="${p.id}">Concluir</button></div>`;
  } else if (p.stage === 'pronto') {
    foot = p.paid ? `<div class="meta"><span class="chip green">${ic('check', 'sm')}Pago</span></div>` : `<button class="btn orange sm" data-act="pay" data-id="${p.id}">Receber ${brl(p.pkg ? 0 : p.price)}</button>`;
  } else if (next) {
    foot = `<button class="btn gray sm" data-act="move" data-id="${p.id}" data-to="${next.id}">${ic(next.icon, 'sm')}${next.verb}</button>`;
  }
  return `<article class="pet" draggable="true" data-id="${p.id}" aria-label="${esc(p.name)}, ${esc(p.svc)}">
    <div class="top">${mono(p.ini, p.g)}<div style="min-width:0"><div class="nm">${esc(p.name)}</div><div class="br">${esc(p.breed)}</div></div><span class="tm num">${p.time}</span></div>
    <div class="svc">${esc(p.svc)}</div>
    <div class="meta"><span class="note">${esc(p.note)}</span>${p.pkg ? `<span class="chip tint">Pacote ${p.pkg.used}/${p.pkg.total}</span>` : ''}</div>
    ${foot}
  </article>`;
}
function moveTo(id, stage, silent) {
  const p = pet(id); if (!p || p.stage === stage) return;
  const prev = p.stage; p.stage = stage;
  if (stage === 'pronto' && !silent) S.ask = id; else if (S.ask === id) S.ask = null;
  render();
  if (!silent) toast(`${p.name} em “${STAGES[stageIdx(stage)].name}”`, () => { S.ask = null; moveTo(id, prev, true); });
}

      <div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px"><div class="field"><label for="f-dia">Dia</label><input class="input" id="f-dia" type="date" value="2026-11-20"></div>
      <div class="field"><label for="f-hora">Horário livre</label><select class="input" id="f-hora">${['12:30 com Júlia', '13:00 com Marcos', '15:00 com Júlia'].map(h => `<option ${S.slot === h ? 'selected' : ''}>${h}</option>`).join('')}</select></div></div>
      <div class="glist"><div class="row"><span class="grow">Confirmar pelo WhatsApp</span><label class="switch"><input type="checkbox" id="f-wa" checked aria-label="Confirmar pelo WhatsApp"><span></span></label></div></div>
      <button class="btn lg">Agendar</button>
    </form></div>`;
  }
  return '';
}
function openSheet(kind, from) { S.lastFocus = from || document.activeElement; S.drawer = kind; render(); const d = $('.sheet'); const f = d && d.querySelector('select, input:not([disabled]), button.pay, button.btn'); f && f.focus(); }
function closeSheet() { S.drawer = ''; render(); const lf = S.lastFocus; if (lf && document.body.contains(lf)) lf.focus(); }

/* roteamento */
const VIEWS = { hoje: [viewHoje, 'Hoje'], agenda: [viewAgenda, 'Agenda'], pets: [viewPets, 'Pets e tutores'], mensagens: [viewMensagens, 'Mensagens'], pacotes: [viewPacotes, 'Pacotes e pontos'], caixa: [viewCaixa, 'Caixa'] };
const route = () => { const h = location.hash.slice(1); return VIEWS[h] ? h : 'hoje'; };
function render() {
  const r = route();
  $('#main').innerHTML = VIEWS[r][0]();
  $('#crumb').textContent = VIEWS[r][1];
  document.querySelectorAll('.side a').forEach(a => { if (a.dataset.route === r) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  const unread = S.threads.filter(t => t.unread).length;
  const b = $('#msgBadge'); b.textContent = unread; b.hidden = !unread; b.setAttribute('aria-label', `${unread} não lidas`);
  $('#overlay').innerHTML = sheetHtml();
  if (r === 'hoje') wireDnD();
  if (r === 'caixa') wireCash();
  if (r === 'pets') wireFilter();
}
window.addEventListener('hashchange', () => { render(); $('#main').focus({ preventScroll: true }); window.scrollTo(0, 0); });

function wireDnD() {
  document.querySelectorAll('.pet').forEach(c => {
    c.addEventListener('dragstart', e => { e.dataTransfer.setData('text/plain', c.dataset.id); c.classList.add('dragging'); });
    c.addEventListener('dragend', () => c.classList.remove('dragging'));
  });
  document.querySelectorAll('.col').forEach(col => {
    col.addEventListener('dragover', e => { e.preventDefault(); col.classList.add('over'); });
    col.addEventListener('dragleave', e => { if (!col.contains(e.relatedTarget)) col.classList.remove('over'); });
    col.addEventListener('drop', e => { e.preventDefault(); col.classList.remove('over'); moveTo(e.dataTransfer.getData('text/plain'), col.dataset.stage); });
  });
}
function wireCash() {
  const inp = $('#gaveta'); if (!inp) return;
  inp.addEventListener('input', () => {
    const exp = S.sales.filter(s => s.pay === 'Dinheiro').reduce((a, s) => a + s.v, 0);
    const v = parseFloat(inp.value.replace(/\./g, '').replace(',', '.'));
    const out = $('#gavetaRes');
    if (isNaN(v)) { out.innerHTML = '–'; return; }
    const d = Math.round((v - exp) * 100) / 100;
    out.innerHTML = d === 0 ? `<span class="chip green">${ic('check', 'sm')}Confere</span>` : d > 0 ? `<span class="chip orange">Sobram ${brl(d)}</span>` : `<span class="chip red">Faltam ${brl(-d)}</span>`;
  });
}
function wireFilter() {
  const inp = $('#busca'); if (!inp) return;
  inp.addEventListener('input', () => { S.filter = inp.value; const pos = inp.selectionStart; render(); const n = $('#busca'); n.focus(); n.setSelectionRange(pos, pos); });
}

document.addEventListener('click', e => {
  if (e.target.matches('[data-scrim]')) { closeSheet(); return; }
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === 'close') closeSheet();
  else if (a === 'toggle') S.notify = el.checked;
  else if (a === 'undo') { const u = S.undo; $('#toastHost').innerHTML = ''; S.undo = null; u && u(); }
  else if (a === 'goagenda') location.hash = 'agenda';
  else if (a === 'move') moveTo(id, el.dataset.to);
  else if (a === 'notify') {
    const p = pet(id);
    if (!S.notify) { S.ask = null; p.note = 'Tutor não avisado'; S.notify = true; render(); return; }
    busy(el, 'Enviando', () => { S.ask = null; p.note = 'Tutor avisado agora'; render(); toast(`Mensagem enviada para ${first(p.tutor)}`); });
  }
  else if (a === 'pay') openSheet('pay:' + id, el);
  else if (a === 'paymethod') { e.preventDefault(); el.parentElement.querySelectorAll('.pay').forEach(b => b.setAttribute('aria-pressed', b === el)); }
  else if (a === 'confirmpay') busy(el, 'Registrando', () => {
    const p = pet(id); const usePkg = $('#usepkg')?.checked; const m = $('.pay[aria-pressed="true"]'); const method = m ? m.textContent.trim() : 'Pacote';
    p.paid = true; if (usePkg && p.pkg) p.pkg.used++; if (!usePkg) p.points += p.price;
    S.sales.unshift({ pet: p.name, svc: p.svc, pay: usePkg ? 'Pacote' : method, v: usePkg ? 0 : p.price, t: '10:45' });
    closeSheet(); toast(usePkg ? `Banho do pacote usado, ${p.name}` : `Recebido de ${first(p.tutor)}`);
  });
  else if (a === 'new') { S.slot = el.dataset.slot || ''; openSheet('new', el); }
  else if (a === 'newpet') toast('O cadastro de pet entra na próxima versão');
  else if (a === 'selpet') { S.selPet = id; render(); }
  else if (a === 'selthread') { S.selThread = id; S.threads.find(x => x.id === id).unread = false; render(); }
  else if (a === 'confirm') busy(el, 'Confirmando', () => { const t = S.threads.find(x => x.id === id); t.offer.state = 'done'; t.unread = false; t.msgs.push(['out', 'Agendado! Thor na quinta, 20/11, às 10h. Até lá!', 'agora, automática']); render(); toast('Agendamento confirmado'); });
  else if (a === 'warnpkg') busy(el, 'Enviando', () => { S.ending[+el.dataset.i].sent = true; render(); toast('Aviso de renovação enviado'); });
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.dataset.form;
  if (f === 'new') {
    const sel = $('#f-pet'), err = $('#f-pet-err');
    if (!sel.value) { sel.setAttribute('aria-invalid', 'true'); sel.setAttribute('aria-describedby', 'f-pet-err'); err.hidden = false; sel.focus(); return; }
    const txt = `${sel.value.split(',')[0]} agendado, ${$('#f-hora').value}`; closeSheet(); toast(txt);
  }
  if (f === 'send') { const inp = $('#msg'); if (!inp.value.trim()) { inp.focus(); return; } const t = S.threads.find(x => x.id === S.selThread); t.msgs.push(['out', inp.value.trim(), 'agora']); render(); $('#msg').focus(); }
  if (f === 'cash') { const btn = e.target.querySelector('button'); busy(btn, 'Fechando', () => { S.cashClosed = true; render(); toast('Caixa fechado e resumo enviado'); }); }
  if (f === 'search') { S.filter = $('#q').value.trim(); if (route() === 'pets') render(); else location.hash = 'pets'; }
});
document.addEventListener('keydown', e => {
  if (!S.drawer) return;
  if (e.key === 'Escape') { closeSheet(); return; }
  if (e.key === 'Tab') {
    const items = [...$('.sheet').querySelectorAll('button:not([disabled]), input:not([disabled]), select')];
    const i = items.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); items[items.length - 1].focus(); }
    else if (!e.shiftKey && i === items.length - 1) { e.preventDefault(); items[0].focus(); }
  }
});
render();
</script>
